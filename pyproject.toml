[project]
name = "pengpt"
version = "0.1.0"
description = "A minimal transformer for pen strokes: handwriting generation"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
wandb = ["wandb"]
dev = ["pytest", "Pillow", "scipy"]
ink = ["Pillow", "scipy", "scikit-image"]

[tool.setuptools]
py-modules = ["pengpt", "utils"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
