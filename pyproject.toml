[project]
name = "pengpt"
version = "0.1.0"
description = "A minimal transformer for pen strokes: handwriting generation and friends"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
wandb = ["wandb"]
dev = ["pytest"]
quality = ["transformers", "Pillow"]   # utils.py rank: CLIP-based filtering
icons = ["svgelements"]                # utils.py icons: SVG icon aggregation

[tool.setuptools]
py-modules = ["pengpt", "utils"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
